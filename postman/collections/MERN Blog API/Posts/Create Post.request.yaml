$kind: http-request
name: Create Post
method: POST
url: 'http://localhost:5000/api/posts'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "My Post Title",
      "content": "Post content here",
      "tags": "ideas"
    }

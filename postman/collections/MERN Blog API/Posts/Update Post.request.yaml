$kind: http-request
name: Update Post
method: PATCH
url: 'http://localhost:5000/api/posts/{{postId}}'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Title",
      "content": "Updated content"
    }
